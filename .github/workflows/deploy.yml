name: Deploy to Cloud Run

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      RUN_REGION: europe-west1
      SERVICE_NAME: stock-analysis-tool

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Google Auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Build and Push Container
        run: |
          # Sanitize PROJECT_ID to remove any accidental whitespace or newlines from the secret
          CLEAN_PROJECT_ID=$(echo "$PROJECT_ID" | tr -d '[:space:]')
          gcloud builds submit . --tag "gcr.io/$CLEAN_PROJECT_ID/$SERVICE_NAME"

      - name: Deploy to Cloud Run
        run: |
          # Sanitize PROJECT_ID here as well
          CLEAN_PROJECT_ID=$(echo "$PROJECT_ID" | tr -d '[:space:]')
          gcloud run deploy $SERVICE_NAME \
            --image "gcr.io/$CLEAN_PROJECT_ID/$SERVICE_NAME" \
            --region $RUN_REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars OPENAI_API_KEY=${{ secrets.OPENAI_KEY }},NEWS_API_KEY=${{ secrets.NEWS_KEY }}
